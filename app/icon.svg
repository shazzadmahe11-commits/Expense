<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- Decorative soft circles, matching the hero-card style in the app -->
  <circle cx="440" cy="70" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="460" r="80" fill="#ffffff" opacity="0.06"/>

  <!-- Monogram G with an upward growth tick -->
  <text x="50%" y="61%" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="800" font-size="272" fill="#ffffff">G</text>

  <!-- Small upward trend accent -->
  <path d="M 336 168 L 392 128 L 392 158 L 356 184 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 336 168 L 392 128 L 366 124 L 330 150 Z" fill="#ffffff" opacity="0.95"/>
</svg>
